services:

  spark-master:
    image: apache/spark:3.5.9
    container_name: spark-master
    environment:
      SPARK_NO_DAEMONIZE: "true"
    command: >
      /opt/spark/sbin/start-master.sh
      --host spark-master
      --port 7077
      --webui-port 8080
    ports:
      - "7077:7077"
      - "8080:8080"
    volumes:
    - ./conf/spark-defaults.conf:/opt/spark/conf/spark-defaults.conf:ro

  spark-worker:
    image: apache/spark:3.5.9
    container_name: spark-worker
    depends_on:
      - spark-master
    environment:
      SPARK_NO_DAEMONIZE: "true"
    command: >
      /opt/spark/sbin/start-worker.sh
      spark://spark-master:7077
      --cores 1

      --memory 1g
      --webui-port 8081
    ports:
      - "8081:8081"
    volumes:
    - ./conf/spark-defaults.conf:/opt/spark/conf/spark-defaults.conf:ro
